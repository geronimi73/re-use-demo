server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    # Content-hashed js/css (incl. the worker)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed static files
    location ~* \.(wav|mp3|svg|png|ico)$ {
        types { audio/wav wav; audio/mpeg mp3; image/svg+xml svg; image/png png; image/x-icon ico; }
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # The page revalidates so it never points at a previous build's chunks
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
}
